name: Build

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.repository == 'embabel/embabel-chat-store'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure testcontainers
        run: echo "testcontainers.reuse.enable=true" >> ~/.testcontainers.properties

      # Docker 29+ raised minimum API version to 1.44; Testcontainers 1.x defaults to 1.32
      - name: Configure Testcontainers for Docker 29+
        run: echo "api.version=1.44" > ~/.docker-java.properties

      - name: Build and test
        run: mvn -U -B test verify

  build-fork:
    name: Build (Fork)
    runs-on: ubuntu-latest
    if: github.repository != 'embabel/embabel-chat-store'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure testcontainers
        run: echo "testcontainers.reuse.enable=true" >> ~/.testcontainers.properties

      # Docker 29+ raised minimum API version to 1.44; Testcontainers 1.x defaults to 1.32
      - name: Configure Testcontainers for Docker 29+
        run: echo "api.version=1.44" > ~/.docker-java.properties

      - name: Build and test
        run: mvn -U -B test verify
